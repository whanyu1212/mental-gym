[project]
name = "mental-gym"
version = "0.1.0"
description = "Build technical fluency through deliberate practice and first-principles implementation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "colorama>=0.4.6,<0.5",
    "numpy>=2.0.1,<3",
    "scikit-learn>=1.0,<2",
]

[dependency-groups]
test = [
    "pytest>=8.2.2,<10",
]
lint = [
    "docformatter>=1.7.5,<2",
    "pre-commit>=3.7.1,<5",
    "ruff>=0.16.9,<0.17",
]
notebook = [
    "ipykernel>=6.29.5,<8",
]

[tool.uv]
default-groups = ["test", "lint"]
package = false

[tool.ruff]
line-length = 89
target-version = "py310"
# Scratch notebooks are gitignored; keep pre-commit (which passes tracked
# files explicitly) consistent with `ruff check .` (which skips them).
extend-exclude = ["*.ipynb"]
force-exclude = true

[tool.ruff.lint]
# Parity with the previous flake8 (pycodestyle + pyflakes) + isort setup.
select = ["E", "W", "F", "I"]

[tool.ruff.format]
# Parity with the previous black --skip-string-normalization.
quote-style = "preserve"
# Leave code snippets in teaching notes as written; black never touched them.
exclude = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["tests/kattis", "src/dsa_from_scratch/two_pointers/python", "src/dsa_from_scratch/hashing/python", "src/kattis/python", "src/leetcode/arrays_hashing/python", "src/leetcode/two_pointers/python", "src/leetcode/sliding_window/python", "src/leetcode/stack/python"]
