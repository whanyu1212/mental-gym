repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-toml

  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types:
          - "python"
        args:
          - "--line-length=89"
          - "--skip-string-normalization"
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types:
          - "python"
        args:
          - "--profile=black"
      - id: docformatter
        name: docformatter
        entry: poetry run docformatter
        language: system
        types:
          - "python"
        args:
          - "--in-place"
          - "--wrap-summaries=72"
          - "--wrap-descriptions=72"
          - "--pre-summary-newline"
      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types:
          - "python"
        args:
          - "--max-line-length=89"
          - "--extend-ignore=E203,W503"
