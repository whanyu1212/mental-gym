repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Official Kattis sample files are kept byte-for-byte as published.
      - id: trailing-whitespace
        exclude: ^tests/kattis/samples/
      - id: end-of-file-fixer
        exclude: ^tests/kattis/samples/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args:
          - "--fix"
      - id: ruff-format

  - repo: local
    hooks:
      - id: docformatter
        name: docformatter
        entry: poetry run docformatter
        language: system
        types:
          - "python"
        args:
          - "--in-place"
          - "--wrap-summaries=72"
          - "--wrap-descriptions=72"
          - "--pre-summary-newline"
