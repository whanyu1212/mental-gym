name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Generate problems data
        run: uv run --locked python scripts/generate_problems.py

      - name: Validate algorithm guides
        run: uv run --locked python scripts/validate_algorithm_guides.py --strict

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Run web tests
        run: bun run --cwd web test

      - name: Build Astro site
        run: bun run --cwd web build

      - name: Verify note routes and highlight keys
        run: bun run --cwd web verify:notes

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
