name: Run Tests

on:
  push:
    branches:
      - main
      - hy-dev
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: |
          uv run --locked pytest tests/ -v --tb=short

      - name: Validate algorithm guides
        run: |
          uv run --locked python scripts/validate_algorithm_guides.py --strict

      - name: Test Summary
        if: always()
        run: |
          echo "### Python Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Python tests completed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY

  test-sql:
    name: SQL Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify SQL test coverage
        run: |
          set -euo pipefail
          coverage_failed=0

          for dialect in postgres sqlite; do
            mapfile -d '' answer_files < <(
              find "src/sql/$dialect" -type f -name '*.sql' \
                ! -name '*.fixture.sql' ! -name '*.test.sql' -print0 | sort -z
            )
            mapfile -d '' test_files < <(
              find "src/sql/$dialect" -type f -name '*.test.sql' -print0 | sort -z
            )

            if (( ${#answer_files[@]} == 0 )); then
              echo "::error::No $dialect SQL answer files found."
              coverage_failed=1
            fi

            for answer_file in "${answer_files[@]}"; do
              test_file="${answer_file%.sql}.test.sql"
              if [[ ! -f "$test_file" ]]; then
                echo "::error file=$answer_file::Missing SQL test: $test_file"
                coverage_failed=1
              fi
            done

            for test_file in "${test_files[@]}"; do
              answer_file="${test_file%.test.sql}.sql"
              if [[ ! -f "$answer_file" ]]; then
                echo "::error file=$test_file::SQL test has no answer file: $answer_file"
                coverage_failed=1
              fi
            done
          done

          exit "$coverage_failed"

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3

      - name: Start PostgreSQL 17
        run: docker compose -f compose.sql.yml up --detach --wait

      - name: Run PostgreSQL exercises
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(find src/sql/postgres -type f -name '*.test.sql' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No PostgreSQL test files found." >&2
            exit 1
          fi

          for test_file in "${test_files[@]}"; do
            echo "Running $test_file"
            docker compose -f compose.sql.yml exec -T postgres \
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f "$test_file"
          done

      - name: Run SQLite exercises
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(find src/sql/sqlite -type f -name '*.test.sql' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No SQLite test files found." >&2
            exit 1
          fi

          for test_file in "${test_files[@]}"; do
            echo "Running $test_file"
            sqlite3 -bail :memory: < "$test_file"
          done

      - name: Stop PostgreSQL 17
        if: always()
        run: docker compose -f compose.sql.yml down

  test-julia:
    name: Julia Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.11'

      - name: Cache Julia packages
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - name: Install Julia dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(; allow_autoprecomp=false)'

      - name: Run Julia tests
        run: |
          set -euo pipefail
          test_files=(tests/leetcode/test*.jl)
          if [[ ! -e "${test_files[0]}" ]]; then
            echo "No Julia test files found." >&2
            exit 1
          fi

          for test_file in "${test_files[@]}"; do
            echo "Running $test_file"
            julia --project=. "$test_file"
          done

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Type-check TypeScript solutions
        run: bun run typecheck

      - name: Run web tests
        run: bun run --cwd web test

      - name: Build Astro site
        run: bun run --cwd web build

      - name: Verify note routes and highlight keys
        run: bun run --cwd web verify:notes

      - name: Run post-build page tests
        run: bun run --cwd web test:built

      # Exercise the upgraded Pages uploader on PRs without deploying the site.
      - name: Upload Pages preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-preview
          path: web/dist
          retention-days: 1
