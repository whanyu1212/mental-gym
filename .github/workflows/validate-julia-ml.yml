name: Validate Julia ML Environment

on:
  pull_request:
    paths:
      - environments/julia-ml/**
      - .github/workflows/validate-julia-ml.yml
  push:
    branches:
      - main
      - hy-dev
    paths:
      - environments/julia-ml/**
      - .github/workflows/validate-julia-ml.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Instantiate Julia ML lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate the locked environment
        run: julia --project=environments/julia-ml -e 'using Pkg; Pkg.instantiate(; allow_autoprecomp=false)'

      - name: Confirm the lockfile stayed current
        run: git diff --exit-code -- environments/julia-ml/Project.toml environments/julia-ml/Manifest.toml
